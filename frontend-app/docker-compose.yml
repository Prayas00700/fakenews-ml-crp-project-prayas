services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Adjust this port if your API runs on a different port internally
    ports:
      - "8000:8000" 
    env_file:
      - .env