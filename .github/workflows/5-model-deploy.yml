name: "5. Model Deploy (SageMaker Endpoint)"

on:
  workflow_run:
    workflows: ["4. Model Evaluate"]
    types: [completed]

  workflow_dispatch:
    inputs:
      model_data:
        description: 'S3 URI of the model artifact (model.tar.gz)'
        required: true
      model_type:
        description: 'nb | lstm | bert'
        required: true
        default: 'lstm'
        type: choice
        options:
          - nb
          - lstm
          - bert

env:
  AWS_REGION:              ${{ vars.AWS_REGION }}
  S3_BUCKET:               ${{ secrets.S3_BUCKET }}
  PROJECT_NAME:            ${{ vars.PROJECT_NAME }}
  SAGEMAKER_ROLE_ARN:      ${{ secrets.SAGEMAKER_ROLE_ARN }}
  SAGEMAKER_ENDPOINT_NAME: ${{ secrets.SAGEMAKER_ENDPOINT_NAME }}
  ENDPOINT_INSTANCE:       ${{ vars.ENDPOINT_INSTANCE || 'ml.m5.large' }}

jobs:
  deploy:
    name: "Deploy Model to SageMaker Endpoint"
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required for OIDC/STS to prevent credential errors
      contents: read   # Required for checkout
      
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # environment: production

    steps:
      # ================================================================
      # Step 1: Checkout
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================================
      # Step 2: Download model-data artifact (if chained)
      # ================================================================
      - name: Download model-data artifact
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID:   ${{ github.event.workflow_run.id }}
          REPO:     ${{ github.repository }}
        run: |
          ARTIFACT_URL=$(gh api \
            repos/$REPO/actions/runs/$RUN_ID/artifacts \
            --jq '.artifacts[] | select(.name == "model-data-eval") | .archive_download_url')
          curl -sL -H "Authorization: Bearer $GH_TOKEN" "$ARTIFACT_URL" -o model-data.zip
          unzip -o model-data.zip

      # ================================================================
      # Step 3: Set MODEL_DATA and MODEL_TYPE env
      # ================================================================
      - name: Load env vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            source model_data_for_deploy.env
          else
            MODEL_DATA=${{ github.event.inputs.model_data }}
            MODEL_TYPE=${{ github.event.inputs.model_type }}
          fi
          echo "MODEL_DATA=$MODEL_DATA" >> $GITHUB_ENV
          echo "MODEL_TYPE=$MODEL_TYPE" >> $GITHUB_ENV

      # ================================================================
      # Step 4: Setup Python
      # ================================================================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up subsequent runs

      # ================================================================
      # Step 5: Install dependencies
      # ================================================================
      - name: Install dependencies
        run: |
          # Ensure sagemaker and dependencies are installed in the 3.10 env
          python3 -m pip install --upgrade pip
          python3 -m pip install boto3 sagemaker pandas torch
          # Debug step: This will prove if sagemaker is installed
          python3 -c "import sagemaker; print('SageMaker version:', sagemaker.__version__)"
          if [ "$MODEL_TYPE" == "bert" ]; then python3 -m pip install transformers; fi

      # ================================================================
      # Step 6: Configure AWS credentials
      # ================================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      # ================================================================
      # Step 7: Run model deployment script
      # ================================================================
      - name: Run model deployment
        id: deploy_info
        run: |
          # Use python3 to ensure library parity with Step 5
          python3 src/deployment/model_deploy.py
          
          # Load the output environment file generated by the script
          source deployment.env
          echo "endpoint_name=$ENDPOINT_NAME" >> $GITHUB_OUTPUT
          echo "model_type=$MODEL_TYPE"       >> $GITHUB_OUTPUT

      # ================================================================
      # Step 8: Log success
      # ================================================================
      - name: Deployment status
        run: |
          echo "=========================================="
          echo "  Model successfully deployed!"
          echo "  Endpoint  : ${{ steps.deploy_info.outputs.endpoint_name }}"
          echo "  Type      : ${{ steps.deploy_info.outputs.model_type }}"
          echo "  Region    : ${{ env.AWS_REGION }}"
          echo "=========================================="

      # ================================================================
      # Step 9: Save deployment artifact for monitoring job
      # ================================================================
      - name: Save deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name:            deployment-info
          path:            deployment.env
          retention-days:  30

      # ================================================================
      # Step 10: Create summary
      # ================================================================
      - name: Create summary
        run: |
          echo "## Model Deployment Complete ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Endpoint Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Endpoint Name: \`${{ steps.deploy_info.outputs.endpoint_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Model Type:    \`${{ steps.deploy_info.outputs.model_type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Region:        \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Instance:      \`${{ env.ENDPOINT_INSTANCE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Step:** Run '6. Monitor Pipeline' to set up Model Monitor" >> $GITHUB_STEP_SUMMARY
