name: "1. Download Data to S3"

# ─────────────────────────────────────────────────────────────────────────────
# When to run
# ─────────────────────────────────────────────────────────────────────────────
on:
  # Manual trigger from GitHub UI
  workflow_dispatch:

  # Trigger when the download script changes
  push:
    branches:
      - main
    paths:
      - 'src/data/data_download.py'

# ─────────────────────────────────────────────────────────────────────────────
# Environment variables — ALL sourced from GitHub Secrets / Variables
# Set these in:  Settings → Secrets and variables → Actions
#
# Required Secrets:
#   S3_BUCKET       — e.g. fake-news-mlops-bucket
#   AWS_ROLE_ARN    — OIDC role ARN for AWS auth
#   KAGGLE_USERNAME — your Kaggle account username
#   KAGGLE_KEY      — your Kaggle API key (from kaggle.com → Account → API)
#
# Required Variables:
#   AWS_REGION      — e.g. ap-south-1
#   PROJECT_NAME    — e.g. fake-news
# ─────────────────────────────────────────────────────────────────────────────
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}


jobs:
  download-data:
    name: "Download from Kaggle & Upload to S3"
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # Required for AWS OIDC role assumption
      contents: read

    steps:
      # ================================================================
      # Step 1: Checkout code
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================================
      # Step 2: Setup Python
      # ================================================================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # ================================================================
      # Step 3: Install dependencies
      # ================================================================
      - name: Install dependencies
        run: |
          pip install pandas boto3 kaggle

      # ================================================================
      # Step 4: Configure AWS credentials (OIDC — no long-lived keys)
      # ================================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      # ================================================================
      # Step 5: Set up Kaggle API credentials
      #
      # The kaggle CLI looks for credentials in ~/.kaggle/kaggle.json
      # We build that file from GitHub secrets here.
      # ================================================================
      - name: Configure Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo '{
            "username": "${{ secrets.KAGGLE_USERNAME }}",
            "key": "${{ secrets.KAGGLE_KEY }}"
          }' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "Kaggle credentials configured"

      # ================================================================
      # Step 6: Download datasets from Kaggle and upload to S3
      #
      # Downloads:
      #   1. vimlendusharma/fake-or-real-news  → fake_or_real_news.csv
      #   2. algord/fakenewsnet               → FakeNewsNet.csv
      #
      # Then uploads both CSVs to:
      #   s3://<S3_BUCKET>/<PROJECT_NAME>/data/raw/
      # ================================================================
      - name: Download from Kaggle & Upload to S3
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:      ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "Downloading datasets from Kaggle..."
          echo "  Dataset 1: vimlendusharma/fake-or-real-news"
          echo "  Dataset 2: algord/fakenewsnet"
          echo ""
          echo "Uploading to s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/data/raw/"

          python src/data/data_download.py \
            --bucket       ${{ env.S3_BUCKET }} \
            --project      ${{ env.PROJECT_NAME }} \
            --download-dir /tmp/kaggle_data

          echo "Download and upload complete"

      # ================================================================
      # Step 7: Verify upload
      # ================================================================
      - name: Verify S3 upload
        run: |
          echo "Verifying files in S3..."

          aws s3 ls s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/data/raw/ \
            --recursive \
            --human-readable

          FILE_COUNT=$(aws s3 ls s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/data/raw/ \
            --recursive | grep -c ".csv" || true)

          echo "Found $FILE_COUNT CSV file(s) in S3"

          if [ "$FILE_COUNT" -lt 2 ]; then
            echo "ERROR: Expected at least 2 CSV files — upload may have failed"
            exit 1
          fi

          echo "S3 upload verified"

      # ================================================================
      # Step 8: Save S3 paths artifact for downstream jobs
      # ================================================================
      - name: Save S3 paths artifact
        uses: actions/upload-artifact@v4
        with:
          name:            s3-paths
          path:            s3_paths.env
          retention-days:  7

      # ================================================================
      # Step 9: Create summary
      # ================================================================
      - name: Create summary
        run: |
          echo "## Data Download & Upload Summary 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Datasets downloaded from **Kaggle** and uploaded to **S3** successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source Datasets:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`vimlendusharma/fake-or-real-news\` → \`fake_or_real_news.csv\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`algord/fakenewsnet\` → \`FakeNewsNet.csv\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- S3 Bucket:    \`${{ env.S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Project:      \`${{ env.PROJECT_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Region:       \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files in S3:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          aws s3 ls s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/data/raw/ \
            --recursive --human-readable >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Step:** Run '2. Data Preprocessing (SageMaker)'" >> $GITHUB_STEP_SUMMARY
