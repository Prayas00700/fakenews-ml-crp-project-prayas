name: Download Data to S3

# When to run this workflow
on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'src/data/data_download.py'

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:
  download-data:
    name: Upload Fake News Dataset to S3
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write  # Required for AWS OIDC
      contents: read
    
    steps:
      # ================================================
      # Step 1: Checkout code
      # ================================================
      - name: Checkout repository
        uses: actions/checkout@v3
      
      # ================================================
      # Step 2: Setup Python
      # ================================================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      # ================================================
      # Step 3: Install dependencies
      # ================================================
      - name: Install dependencies
        run: pip install pandas boto3
      
      # ================================================
      # Step 4: Configure AWS credentials
      # ================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      # ================================================
      # Step 5: Create S3 bucket structure
      # ================================================
      - name: Setup S3 bucket
        run: |
          # Check if bucket exists
          if ! aws s3 ls s3://${{ env.S3_BUCKET }} 2>/dev/null; then
            echo "Creating S3 bucket..."
            aws s3 mb s3://${{ env.S3_BUCKET }} --region ${{ env.AWS_REGION }}
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket ${{ env.S3_BUCKET }} \
              --versioning-configuration Status=Enabled
          else
            echo "Bucket already exists"
          fi
          
          # Create folder structure for Fake News Project
          aws s3api put-object --bucket ${{ env.S3_BUCKET }} --key ${{ env.PROJECT_NAME }}/data/raw/
          aws s3api put-object --bucket ${{ env.S3_BUCKET }} --key ${{ env.PROJECT_NAME }}/data/processed/
          aws s3api put-object --bucket ${{ env.S3_BUCKET }} --key ${{ env.PROJECT_NAME }}/models/
          
          echo "✅ S3 structure created"
      
      # ================================================
      # Step 6: Run data download script
      # ================================================
      - name: Upload datasets to S3
        id: download
        working-directory: ./
        run: |
          echo "Starting data upload process..."
          
          # Ensure the script can find the local data files in data/ folder
          python src/data/data_download.py \
            --bucket ${{ env.S3_BUCKET }} \
            --project ${{ env.PROJECT_NAME }}
          
          echo "✅ Data upload complete"
      
      # =================================================
      # Step 7: Verify upload
      # =================================================
      - name: Verify S3 upload
        run: |
          echo "Verifying files in S3..."
          
          aws s3 ls s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/data/raw/ --recursive
          
          # Count files
          FILE_COUNT=$(aws s3 ls s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/data/raw/ --recursive | wc -l)
          
          echo "Found $FILE_COUNT files in S3"
          
          if [ $FILE_COUNT -lt 1 ]; then
            echo "❌ No files found in S3"
            exit 1
          fi