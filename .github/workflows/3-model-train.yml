name: "3. Model Training (SageMaker)"

on:
  workflow_dispatch:
    inputs:
      model_type:
        description: 'Model type to train'
        required:    true
        default:     'bert'
        type:        choice
        options:
          - nb
          - bert
      epochs:
        description: 'Number of training epochs'
        required:    false
        default:     '10'
      batch_size:
        description: 'Batch size'
        required:    false
        default:     '8'

  workflow_run:
    workflows: ["2. Data Preprocessing (SageMaker)"]
    types: [completed]

  push:
    branches:
      - main
    paths:
      - 'src/model/model_train.py'

env:
  AWS_REGION:               ${{ vars.AWS_REGION }}
  S3_BUCKET:                ${{ secrets.S3_BUCKET }}
  PROJECT_NAME:             ${{ vars.PROJECT_NAME }}
  SAGEMAKER_ROLE_ARN:       ${{ secrets.SAGEMAKER_ROLE_ARN }}
  SAGEMAKER_INSTANCE_TRAIN: ${{ vars.SAGEMAKER_INSTANCE_TRAIN || 'ml.g4dn.xlarge' }}
  SAGEMAKER_INSTANCE:       ${{ vars.SAGEMAKER_INSTANCE       || 'ml.m5.xlarge' }}

jobs:
  # ================================================================
  # Job 1: Submit the training job and exit immediately
  # ================================================================
  train-model:
    name: "Train Model on SageMaker"
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      id-token: write
      contents: read

    outputs:
      job-name:   ${{ steps.start-training.outputs.job_name }}
      model-type: ${{ steps.start-training.outputs.model_type }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3 sagemaker

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Verify processed data exists
        run: |
          echo "Checking for processed data in S3..."
          FILE_COUNT=$(aws s3 ls \
            s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/data/processed/ \
            --recursive | wc -l || true)
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "ERROR: No processed data found!"
            echo "Please run '2. Data Preprocessing' workflow first."
            exit 1
          fi
          echo "Found $FILE_COUNT processed data file(s) — proceeding"

      - name: Start SageMaker Training Job
        id: start-training
        run: |
          python src/model/model_train.py \
            --bucket     ${{ env.S3_BUCKET }} \
            --prefix     ${{ env.PROJECT_NAME }} \
            --model-type ${{ github.event.inputs.model_type || 'bert' }} \
            --epochs     ${{ github.event.inputs.epochs     || '10' }} \
            --batch-size ${{ github.event.inputs.batch_size || '8' }} \
            --no-wait

          source model_data.env
          echo "job_name=$TRAINING_JOB_NAME" >> $GITHUB_OUTPUT
          echo "model_type=$MODEL_TYPE"       >> $GITHUB_OUTPUT

      - name: Save job artifact
        uses: actions/upload-artifact@v4
        with:
          name:           model-data
          path:           model_data.env
          retention-days: 7

      - name: Summary
        run: |
          echo "## Training Job Submitted" >> $GITHUB_STEP_SUMMARY
          echo "- Job: \`${{ steps.start-training.outputs.job_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Instance: \`${{ env.SAGEMAKER_INSTANCE_TRAIN }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Epochs: \`${{ github.event.inputs.epochs || '10' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Poll job below is waiting for completion..." >> $GITHUB_STEP_SUMMARY

  # ================================================================
  # Job 2: Poll for completion with a fresh OIDC token
  # Separate job = new token = no expiry during long training runs
  # ================================================================
  poll-training:
    name: "Poll Training Job Until Complete"
    runs-on: ubuntu-latest
    needs: train-model

    permissions:
      id-token: write
      contents: read

    outputs:
      model-s3-uri: ${{ steps.poll.outputs.model_uri }}
      model-type:   ${{ steps.poll.outputs.model_type }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3

      - name: Download job artifact
        uses: actions/download-artifact@v4
        with:
          name: model-data

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Poll until complete
        id: poll
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          python3 - <<'PYEOF'
          import boto3, time, os, sys

          env_text   = open("model_data.env").read()
          job_name   = [l.split("=",1)[1] for l in env_text.splitlines() if l.startswith("TRAINING_JOB_NAME=")][0]
          model_type = [l.split("=",1)[1] for l in env_text.splitlines() if l.startswith("MODEL_TYPE=")][0]
          region     = os.environ["AWS_REGION"]

          print("Polling job:", job_name)
          print("Region:     ", region)

          last_status    = None
          last_secondary = None
          start_time     = time.time()

          while True:
              sm       = boto3.client("sagemaker", region_name=region)
              response = sm.describe_training_job(TrainingJobName=job_name)
              status    = response["TrainingJobStatus"]
              secondary = response.get("SecondaryStatus", "")

              if status != last_status or secondary != last_secondary:
                  elapsed = int(time.time() - start_time)
                  print(f"[{elapsed}s] {status} -> {secondary}")
                  last_status    = status
                  last_secondary = secondary

              if status == "Completed":
                  model_uri = response["ModelArtifacts"]["S3ModelArtifacts"]
                  elapsed   = int(time.time() - start_time)
                  print(f"Done in {elapsed}s ({elapsed/60:.1f} min)")
                  print(f"Model URI: {model_uri}")

                  with open("model_data.env", "w") as f:
                      f.write(f"MODEL_DATA={model_uri}\n")
                      f.write(f"MODEL_TYPE={model_type}\n")
                      f.write(f"TRAINING_JOB_NAME={job_name}\n")

                  gh_out = os.environ["GITHUB_OUTPUT"]
                  with open(gh_out, "a") as f:
                      f.write(f"model_uri={model_uri}\n")
                      f.write(f"model_type={model_type}\n")
                  break

              elif status in ("Failed", "Stopped"):
                  reason = response.get("FailureReason", "Unknown")
                  print(f"Job failed: {reason}")
                  sys.exit(1)

              time.sleep(60)
          PYEOF

      - name: Verify model artifacts in S3
        run: |
          aws s3 ls s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/models/output/ \
            --recursive --human-readable

      - name: Update artifact with final model URI
        uses: actions/upload-artifact@v4
        with:
          name:           model-data
          path:           model_data.env
          retention-days: 7
          overwrite:      true

      - name: Summary
        run: |
          echo "## Training Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Job: \`${{ needs.train-model.outputs.job-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Model URI: \`${{ steps.poll.outputs.model_uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next:** Run workflow 4 - Model Evaluate" >> $GITHUB_STEP_SUMMARY
